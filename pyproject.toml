[project]
name = "frostguard-scab"
version = "0.2.0"
description = "Physics-informed apple scab & frost early-warning system for Kashmir orchards (Revised Mills + ONNX vision)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "peerzadarabet1807" }]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: hits the live Open-Meteo API (opt-in via FROSTGUARD_NETWORK_TESTS=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
