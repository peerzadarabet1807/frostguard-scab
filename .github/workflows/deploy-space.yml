name: Deploy API to Hugging Face Space

# Redeploys the backend Space whenever API code, data or the model card change.
# Needs a repository secret HF_TOKEN (Hugging Face *write* token); without it the job is skipped.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "models/model_card.json"
      - "models/fallback/**"
      - "requirements-runtime.txt"
      - "Dockerfile"
      - "scripts/download_model.py"
      - "scripts/deploy_hf_space.py"
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }} # optional owner/name override
    steps:
      - name: Skip when HF_TOKEN is not configured
        if: env.HF_TOKEN == ''
        run: echo "::notice::HF_TOKEN secret not set - skipping Space deployment."
      - uses: actions/checkout@v7
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v7
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.11"
      - name: Deploy
        if: env.HF_TOKEN != ''
        run: |
          pip install "huggingface_hub>=0.34"
          python scripts/deploy_hf_space.py
