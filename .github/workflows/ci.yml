name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime dependencies (no PyTorch needed for tests)
        run: pip install -r requirements-runtime.txt pytest
      - name: Run tests (network calls are stubbed; live Open-Meteo test is opt-in)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t frostguard-scab:ci .
      - name: Smoke-test API container
        run: |
          docker run -d --name api -p 8000:8000 -e FROSTGUARD_OFFLINE=1 frostguard-scab:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && break; sleep 2; done
          curl -fsS -X POST http://localhost:8000/api/v1/predict-risk \
            -H 'Content-Type: application/json' -d '{"zone": "shopian"}' | head -c 400
