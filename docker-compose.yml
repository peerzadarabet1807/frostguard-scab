name: frostguard-scab

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: frostguard-scab-api:latest
    container_name: frostguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LOG_LEVEL: INFO
      WEB_CONCURRENCY: 2
      # Set to 1 to skip Open-Meteo and use simulated weather (air-gapped demos).
      FROSTGUARD_OFFLINE: ${FROSTGUARD_OFFLINE:-0}
      FROSTGUARD_CORS_ORIGINS: http://localhost:8080,http://localhost:5173

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    image: frostguard-scab-web:latest
    container_name: frostguard-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
